<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início · Open Finance Hub</title>

  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/inicio.css">
  <script src="js/tema.js"></script>
</head>
<body>

  <div class="app">

   
    <div class="overlay" id="overlay" hidden></div>

   
    <aside class="sidebar" id="sidebar">
      <p class="sidebar__logo">Open <span>Finance</span></p>

      <nav class="menu" aria-label="Navegação principal">
        <ul class="menu__list">
          <li><a href="inicio.html" class="menu__link is-active" aria-current="page">Início</a></li>
          <li><a href="instituicoes.html" class="menu__link">Instituições</a></li>
          <li><a href="extrato.html" class="menu__link">Extrato</a></li>
          <li><a href="fluxo.html" class="menu__link">Fluxo</a></li>
        </ul>
      </nav>
    </aside>

   
    <div class="content">

      
      <header class="topbar">
        <div class="topbar__left">
        
          <button
            type="button"
            class="hamburger"
            id="btn-menu"
            aria-label="Abrir menu"
            aria-controls="sidebar"
            aria-expanded="false">
            <span class="hamburger__bar"></span>
            <span class="hamburger__bar"></span>
            <span class="hamburger__bar"></span>
          </button>
          <h1 class="topbar__title" id="titulo-tela">Início</h1>
        </div>

        <div class="topbar__right">
          <button type="button" class="tema-btn js-tema" aria-pressed="false">Modo escuro</button>
          <div class="profile-wrap">
            <button type="button" class="profile" id="btn-perfil" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-perfil">
              <span class="profile__avatar" aria-hidden="true">AS</span>
              <span class="profile__info">
                <span class="profile__name">Ana Souza</span>
                <span class="profile__email">ana@email.com</span>
              </span>
            </button>
            <ul class="profile-menu" id="menu-perfil" role="menu" hidden>
              <li role="none"><button type="button" role="menuitem" class="profile-menu__item" id="btn-cadastro">Meu cadastro</button></li>
              <li role="none"><button type="button" role="menuitem" class="profile-menu__item profile-menu__item--sair" id="btn-sair">Sair</button></li>
            </ul>
          </div>
        </div>
      </header>

      <main class="main" id="conteudo">

        <div class="summary">
          <section class="card card--total" aria-labelledby="total-label">
            <h2 class="card__label" id="total-label">Patrimônio total</h2>
            <p class="card__total" id="total">R$ 0,00</p>
            <p class="card__note" id="total-nota"></p>
          </section>

          <section class="card card--chart" aria-labelledby="chart-label">
            <h2 class="card__titulo" id="chart-label">Composição do patrimônio (R$)</h2>

            <div class="card__corpo">
              <div class="donut-wrap" id="donut-wrap">
                <canvas id="grafico-rosca" role="img" aria-label="Gráfico de rosca da composição do patrimônio"></canvas>
              </div>
              <p class="donut-vazio" id="donut-vazio" hidden>Conecte uma instituição para ver a composição.</p>

              <ul class="legend" id="legenda"></ul>
            </div>
          </section>
        </div>

        <section aria-labelledby="inst-titulo">
          <h2 class="section-title" id="inst-titulo">Por instituição</h2>
          <ul class="inst-list" id="inst-lista"></ul>
        </section>

        <section class="card card--mercado" aria-labelledby="mercado-titulo">
          <h2 class="mercado__title" id="mercado-titulo">Mercado hoje</h2>
          <div class="mercado" id="mercado" aria-live="polite">
            <p class="mercado__msg">Carregando indicadores…</p>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
